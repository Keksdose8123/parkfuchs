<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkfuchs</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16583f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Farbwelt: Fahrbahn und Markierungsfarbe. Kosten tragen die Farbe der Buchtkante. */
:root{
  --grund:#eef0ec; --flaeche:#ffffff; --text:#14181a; --leise:#5f6b63; --linie:#d8ddd6;
  --marke:#16583f; --auf-marke:#ffffff;
  --frei:#17694a; --zahlen:#a86d17; --unklar:#7e877f; --warn:#b23a2b;
  --schatten:0 1px 2px rgba(20,24,26,.06), 0 8px 20px -12px rgba(20,24,26,.30);
  --gehoben:0 2px 4px rgba(20,24,26,.08), 0 16px 32px -14px rgba(20,24,26,.42);
  --schrift:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --schmal:"Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --grund:#101315; --flaeche:#191d1f; --text:#e9ede7; --leise:#98a29a; --linie:#2a2f2c;
    --marke:#5fbe8c; --auf-marke:#0e1211;
    --frei:#5fbe8c; --zahlen:#e0a45c; --unklar:#8a938c; --warn:#e8776a;
    --schatten:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -12px rgba(0,0,0,.8);
    --gehoben:0 2px 6px rgba(0,0,0,.6), 0 18px 36px -14px rgba(0,0,0,.95);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  background:var(--grund); color:var(--text);
  font:400 16px/1.45 var(--schrift);
  -webkit-font-smoothing:antialiased;
}
body.navi{padding-top:calc(150px + env(safe-area-inset-top))}

/* ---------- Kopf ---------- */
kopf, .kopf-zeile{display:flex}
.kopf-zeile{align-items:center;gap:10px;margin:2px 0 16px}
.kopf-zeile img{width:32px;height:32px;border-radius:8px;flex:none}
.wortmarke{
  font:700 21px/1 var(--schmal); letter-spacing:.13em; text-transform:uppercase; margin:0;
}

/* ---------- Eingabe ---------- */
form{display:flex;gap:8px}
input,button{font:inherit;border-radius:11px;border:1px solid var(--linie)}
input{
  flex:1;min-width:0;padding:13px 14px;background:var(--flaeche);color:var(--text);
  box-shadow:var(--schatten);
}
input::placeholder{color:var(--leise)}
input:focus-visible,button:focus-visible,.bucht:focus-visible,summary:focus-visible{
  outline:3px solid var(--marke);outline-offset:2px
}
button{
  padding:13px 16px;background:var(--marke);color:var(--auf-marke);border-color:transparent;
  font-weight:600;cursor:pointer;-webkit-appearance:none;
}
.mikro{padding:13px 12px;font-size:18px;line-height:1}
.zweit{
  background:transparent;color:var(--marke);border-color:var(--linie);
  width:100%;margin-top:8px;font-weight:600;box-shadow:none;
}

/* ---------- Statusband ---------- */
#status{
  margin:16px 0 12px;color:var(--leise);
  font:500 13px/1.5 var(--schrift); letter-spacing:.02em;
}
#status b{color:var(--text);font-weight:700}
#status.fehler{color:var(--warn)}

#schalter{display:none;gap:7px;margin:0 0 14px}
#schalter.an{display:flex}
.schalter{
  flex:1;padding:9px 4px;background:var(--flaeche);color:var(--leise);
  border:1px solid var(--linie);border-radius:9px;cursor:pointer;white-space:nowrap;
  font:600 12px/1.2 var(--schrift); letter-spacing:.04em; text-transform:uppercase;
}
.schalter[aria-pressed="true"]{background:var(--marke);color:var(--auf-marke);border-color:transparent}

/* ---------- Karte ---------- */
#landkarte{
  height:38vh;min-height:200px;border-radius:13px;border:1px solid var(--linie);
  margin-bottom:14px;overflow:hidden;z-index:0;box-shadow:var(--schatten);
}
.leaflet-popup-content{margin:9px 11px;font:500 13px/1.4 var(--schrift)}

/* ---------- Buchten ---------- */
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
li{
  position:relative;background:var(--flaeche);border:1px solid var(--linie);
  border-radius:12px;overflow:hidden;box-shadow:var(--schatten);
  transition:box-shadow .18s ease, transform .18s ease;
}
/* Die gemalte Buchtkante - traegt die Kosten als Farbe */
li::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:var(--kante,var(--unklar));transition:width .18s ease;
}
li.gewaehlt{box-shadow:var(--gehoben);transform:translateY(-1px)}
li.gewaehlt::before{width:11px}
li.gewaehlt .bucht{background:color-mix(in srgb, var(--kante) 7%, transparent)}

.bucht{
  display:flex;align-items:center;gap:12px;padding:13px 14px 13px 19px;
  cursor:pointer;transition:background .18s ease;
}
.text{min-width:0;flex:1}
.name{
  font:600 16.5px/1.25 var(--schrift);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.art{font:500 12px/1.2 var(--schrift);letter-spacing:.05em;text-transform:uppercase;color:var(--leise);margin-bottom:3px}
.meta{margin-top:5px;font:400 13.5px/1.45 var(--schrift);color:var(--leise);
  display:flex;flex-wrap:wrap;gap:2px 9px}
.frei{color:var(--frei);font-weight:600}
.geld{color:var(--zahlen);font-weight:600}
.hinweis{color:var(--warn);font-weight:600}
.offen{color:var(--unklar)}

/* Entfernung als Schlagzeile: im Auto ist sie die Entscheidungsgroesse, nicht der Name. */
.weite{flex:none;text-align:right;line-height:.92}
.weite .zahl{font:700 33px/1 var(--schmal);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.weite .einheit{display:block;margin-top:3px;font:600 10.5px/1 var(--schrift);
  letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.weite .fuss{display:block;margin-top:5px;font:500 11.5px/1 var(--schrift);color:var(--leise)}

/* Der Knopf gehoert nur an die gewaehlte Bucht - 25 gestapelte Knoepfe sind Laerm. */
.aktion{display:none;gap:8px;padding:0 14px 12px 19px}
li.gewaehlt .aktion{display:flex}
.aktion button{flex:1;padding:11px 12px;border-radius:10px;font-weight:700;font-size:15px}

details{border-top:1px solid var(--linie)}
summary{
  padding:9px 14px 9px 19px;color:var(--leise);cursor:pointer;
  font:500 12.5px/1.2 var(--schrift);letter-spacing:.04em;text-transform:uppercase;
}
.tags{padding:2px 14px 11px 19px;font:400 13px/1.5 var(--schrift);
  display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.tags .k{color:var(--leise);word-break:break-all}
.tags .v{word-break:break-word}
.raus{display:inline-block;margin:0 14px 12px 19px;font:600 12.5px/1 var(--schrift);color:var(--marke)}

footer{margin-top:24px;font:400 12.5px/1.6 var(--schrift);color:var(--leise)}

/* ---------- Routenführung ---------- */
#fuehrung{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:#0f4531;color:#fff;
  padding:calc(13px + env(safe-area-inset-top)) 16px 13px;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
}
#fuehrung .anweisung{font:700 21px/1.2 var(--schmal);letter-spacing:.01em}
#fuehrung .entfernung{font:800 40px/1 var(--schmal);font-variant-numeric:tabular-nums;margin-top:3px}
#fuehrung .rest{display:flex;justify-content:space-between;align-items:center;
  margin-top:11px;font:500 13px/1 var(--schrift);gap:12px;color:rgba(255,255,255,.85)}
#fuehrung button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);
  color:#fff;padding:8px 14px;font:600 13px/1 var(--schrift);border-radius:9px}

/* ---------- Bewegung: einmal beim Erscheinen, sonst nichts ---------- */
@keyframes einfahren{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
li.neu{animation:einfahren .32s cubic-bezier(.2,.7,.3,1) backwards}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div id="fuehrung" hidden>
  <div class="anweisung" id="fAnweisung">Route wird berechnet …</div>
  <div class="entfernung" id="fEntfernung"></div>
  <div class="rest"><span id="fRest"></span><button id="fEnde" type="button">Beenden</button></div>
</div>

<div class="kopf-zeile">
  <img src="icon-192.png" alt="">
  <h1 class="wortmarke">Parkfuchs</h1>
</div>

<form id="formular">
  <input id="eingabe" type="search" enterkeyhint="search" autocomplete="off"
         placeholder="Zieladresse oder Ort">
  <button class="mikro" id="mikro" type="button" title="Ziel diktieren" aria-label="Ziel diktieren">&#127908;</button>
  <button type="submit">Suchen</button>
</form>
<button class="zweit" id="hier" type="button">Ich bin schon da &mdash; hier suchen</button>

<p id="status"></p>

<div id="schalter">
  <button class="schalter" id="fKostenlos" aria-pressed="false" type="button">kostenlos</button>
  <button class="schalter" id="fAnwohner" aria-pressed="false" type="button">ohne Anwohner</button>
  <button class="schalter" id="fAnsage" aria-pressed="true" type="button">Ansage</button>
</div>

<div id="landkarte" hidden></div>
<ul id="liste"></ul>
<button class="zweit" id="weiter" type="button" hidden>Umkreis verdoppeln</button>

<footer>
  Daten: OpenStreetMap, Route von OSRM. Entfernung ist Luftlinie zum Ziel.<br>
  Freie Pl&auml;tze in Echtzeit gibt es hier nicht &mdash; die Daten sagen, <em>wo</em> geparkt
  werden darf und zu welchen Bedingungen.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="park.js"></script>
<script src="navi.js"></script>
<script>
const OVERPASS = 'https://overpass-api.de/api/interpreter';
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
// ponytail: 342 Treffer in der Innenstadt sind unlesbar. Die naechsten 25 reichen.
const MAX = 25;

const $ = id => document.getElementById(id);
const sicher = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const an = id => $(id).getAttribute('aria-pressed') === 'true';
const ruhig = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let radius = 1000, ziel = null, treffer = [], privatAus = 0, angezeigt = [];
// Die Standortabfrage laeuft bis zu 10 s. Tippt man derweil ein Ziel ein, darf ihre
// spaete Antwort das Ergebnis nicht mehr ueberschreiben.
let suchNr = 0;
let landkarte = null, ebene = null, marker = [], gewaehlt = -1;

function zeigen(html, fehler) {
  $('status').innerHTML = html;
  $('status').className = fehler ? 'fehler' : '';
}

const kanteVon = p => p.gebuehr === 'kostenlos' ? 'var(--frei)'
                    : p.gebuehr === 'gebuehrenpflichtig' ? 'var(--zahlen)' : 'var(--unklar)';
const punktVonKosten = p => p.gebuehr === 'kostenlos' ? '#17694a'
                    : p.gebuehr === 'gebuehrenpflichtig' ? '#c07818' : '#7e877f';

const naviLink = p =>
  'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon + '&travelmode=driving';

/* ---------- Sprache ------------------------------------------------------- */

// iOS gibt die Sprachausgabe nur frei, wenn sie einmal aus einer echten
// Nutzeraktion heraus angestossen wurde. Darum beim ersten Tippen anstupsen.
let stimmeBereit = false;
function stimmeFreischalten() {
  if (stimmeBereit || !window.speechSynthesis) return;
  const leer = new SpeechSynthesisUtterance(' ');
  leer.volume = 0;
  speechSynthesis.speak(leer);
  stimmeBereit = true;
}

// Ohne ausdrückliche Wahl nimmt der Browser irgendeine deutsche Stimme — oft die
// blecherne Standardstimme. Die Bewertung bevorzugt die hochwertigen Ansagestimmen.
let stimme = null;
function stimmeWaehlen() {
  if (!window.speechSynthesis) return;
  const deutsch = speechSynthesis.getVoices()
    .filter(v => (v.lang || '').toLowerCase().indexOf('de') === 0);
  if (!deutsch.length) return;
  const punkte = v => (/neural|premium|enhanced|siri/i.test(v.name) ? 4 : 0)
                    + (/google/i.test(v.name) ? 3 : 0)
                    + (/helena|anna|petra|katja|markus|conrad|vicki/i.test(v.name) ? 2 : 0)
                    + ((v.lang || '').toLowerCase() === 'de-de' ? 1 : 0);
  stimme = deutsch.slice().sort((a, b) => punkte(b) - punkte(a))[0];
}
stimmeWaehlen();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = stimmeWaehlen;

function ansagen(text) {
  if (!an('fAnsage') || !window.speechSynthesis) return;
  const sprich = new SpeechSynthesisUtterance(vorlesbar(text));
  sprich.lang = 'de-DE';
  if (stimme) sprich.voice = stimme;
  sprich.rate = 0.96;      // eine Spur ruhiger als die Vorgabe, klingt weniger gehetzt
  speechSynthesis.cancel();
  speechSynthesis.speak(sprich);
}

function fundAnsage(p) {
  const teile = [p.name || p.art, p.meter + ' Meter'];
  if (p.preis) teile.push(p.preis);            // vorlesbar() macht daraus "2,50 Euro pro Stunde"
  else if (p.gebuehr === 'kostenlos') teile.push('kostenlos');
  else if (p.gebuehr === 'gebuehrenpflichtig') teile.push('kostenpflichtig, Preis unbekannt');
  if (p.zugang === 'Anwohner') teile.push('nur für Anwohner');
  if (p.kapazitaet) teile.push(p.kapazitaet + ' Plätze');
  return 'Nächste Möglichkeit: ' + teile.join(', ') + '.';
}

const Erkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Erkennung) $('mikro').hidden = true;

$('mikro').onclick = function () {
  stimmeFreischalten();
  const hoerer = new Erkennung();
  hoerer.lang = 'de-DE';
  hoerer.interimResults = false;
  hoerer.maxAlternatives = 1;
  zeigen('Sprich dein Ziel …');
  hoerer.onresult = function (ev) {
    $('eingabe').value = ev.results[0][0].transcript;
    $('formular').requestSubmit();
  };
  hoerer.onerror = function () { zeigen('Nichts verstanden — bitte nochmal oder eintippen.', true); };
  hoerer.start();
};

/* ---------- Daten --------------------------------------------------------- */

async function geocode(text) {
  const url = NOMINATIM + '?format=jsonv2&limit=1&countrycodes=de,at,it&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Adresssuche nicht erreichbar.');
  const funde = await res.json();
  if (!funde.length) throw new Error('Adresse nicht gefunden. Anders schreiben oder Ort dazu?');
  return { lat: +funde[0].lat, lon: +funde[0].lon, label: funde[0].display_name };
}

async function parkdatenHolen(lat, lon, r) {
  const q = '[out:json][timeout:25];('
    + 'nwr["amenity"="parking"](around:' + r + ',' + lat + ',' + lon + ');'
    + 'way[~"^parking:(left|right|both)$"~"^(lane|street_side)$"](around:' + r + ',' + lat + ',' + lon + ');'
    + ');out center;';
  // ponytail: ein einziger oeffentlicher Dienst, gedrosselt. Faellt er dauerhaft aus,
  // hilft nur eine eigene Datenbank aus den OSM-Landesextrakten.
  const res = await fetch(OVERPASS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'data=' + encodeURIComponent(q),
  });
  if (res.status === 429) throw new Error('Der Kartendienst drosselt gerade. Kurz warten.');
  if (res.status === 504) throw new Error('Der Kartendienst ist überlastet.');
  if (!res.ok) throw new Error('Kartendienst antwortet nicht (' + res.status + ').');
  const daten = await res.json();
  return daten.elements || [];
}

async function laden() {
  $('liste').innerHTML = '';
  $('schalter').classList.remove('an');
  $('weiter').hidden = true;
  zeigen('Suche Parkmöglichkeiten im Umkreis von ' + radius + ' m …');
  try {
    const roh = await parkdatenHolen(ziel.lat, ziel.lon, radius);
    const auf = aufbereiten(roh, ziel.lat, ziel.lon);
    treffer = auf.treffer;
    privatAus = auf.privatAusgeblendet;
    zeichnen(true);
  } catch (e) {
    zeigen(sicher(e.message) + '<button class="zweit" type="button" onclick="laden()">Nochmal versuchen</button>', true);
    $('weiter').hidden = true;
  }
}

/* ---------- Darstellung --------------------------------------------------- */

function weiteHtml(m) {
  const km = m >= 1000;
  const zahl = km ? (m / 1000).toFixed(1).replace('.', ',') : m;
  return '<div class="weite"><span class="zahl">' + zahl + '</span>'
       + '<span class="einheit">' + (km ? 'km' : 'm') + '</span>'
       + '<span class="fuss">' + Math.max(1, Math.round(m / 80)) + ' Min zu Fuß</span></div>';
}

function eintrag(p, nr) {
  const teile = [];
  if (p.gebuehr === 'kostenlos') {
    teile.push('<span class="frei">kostenlos</span>');
  } else if (p.gebuehr === 'gebuehrenpflichtig') {
    // Preis steht in OSM selten drin. Wenn doch, ist er die wichtigste Angabe der Bucht.
    teile.push(p.preis
      ? '<span class="geld">' + sicher(p.preis) + '</span>'
      : '<span class="geld">kostenpflichtig</span> <span class="offen">Preis nicht hinterlegt</span>');
  } else {
    teile.push('<span class="offen">Gebühr nicht hinterlegt</span>');
  }
  if (p.zugang === 'Anwohner') teile.push('<span class="hinweis">nur Anwohner</span>');
  else if (p.zugang === 'Kunden') teile.push('<span class="hinweis">nur Kunden</span>');
  else if (p.zugang === 'Behindertenparkplatz') teile.push('<span class="hinweis">Behindertenparkplatz</span>');
  if (p.zeiten) teile.push('geöffnet ' + sicher(p.zeiten));
  if (p.maxdauer) teile.push('max. ' + sicher(p.maxdauer));
  if (p.kapazitaet) teile.push(p.kapazitaet + (p.kapazitaet === 1 ? ' Platz' : ' Plätze'));
  if (p.hoehe) teile.push('<span class="hinweis">Einfahrt ' + String(p.hoehe).replace('.', ',') + ' m</span>');

  // Rohdaten deutsch beschriftet; der OSM-Schluessel bleibt als Titel erhalten.
  const schluessel = Object.keys(p.tags).sort((a, b) => begriff(a).localeCompare(begriff(b), 'de'));
  const rohdaten = schluessel.map(k =>
    '<span class="k" title="' + sicher(k) + '">' + sicher(begriff(k)) + '</span>'
    + '<span class="v">' + sicher(wertText(k, p.tags[k])) + '</span>').join('');

  return '<li class="neu" id="bucht' + nr + '" style="--kante:' + kanteVon(p) + ';animation-delay:'
    + (ruhig() ? 0 : Math.min(nr, 12) * 28) + 'ms">'
    + '<div class="bucht" role="button" tabindex="0" data-nr="' + nr + '" aria-expanded="false">'
    + '<div class="text">'
    + (p.name ? '<div class="art">' + p.art + '</div>' : '')
    + '<div class="name">' + (p.name ? sicher(p.name) : p.art) + '</div>'
    + '<div class="meta">' + teile.map(t => '<span>' + t + '</span>').join('') + '</div></div>'
    + weiteHtml(p.meter) + '</div>'
    + '<div class="aktion"><button type="button" data-los="' + nr + '">Losfahren</button></div>'
    + '<details><summary>alle Angaben (' + schluessel.length + ')</summary>'
    + '<div class="tags">' + rohdaten + '</div>'
    + '<a class="raus" href="' + naviLink(p) + '" target="_blank" rel="noopener">in Google Maps öffnen</a> '
    + (p.web ? '<a class="raus" href="' + sicher(p.web) + '" target="_blank" rel="noopener">Website des Betreibers</a> ' : '')
    + '<a class="raus" href="https://www.openstreetmap.org/' + p.id + '" target="_blank" rel="noopener">bei OpenStreetMap nachtragen</a>'
    + '</details></li>';
}

function kartenAufbauen() {
  if (landkarte) return true;
  if (!window.L) return false;                 // ohne Leaflet bleibt die Liste nutzbar
  landkarte = L.map('landkarte', { zoomControl: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(landkarte);
  L.control.zoom({ position: 'topright' }).addTo(landkarte);
  return true;
}

function kartenZeichnen(liste) {
  $('landkarte').hidden = false;
  if (!kartenAufbauen()) { $('landkarte').hidden = true; return; }
  if (ebene) ebene.remove();
  ebene = L.layerGroup().addTo(landkarte);
  marker = [];

  const punkte = [[ziel.lat, ziel.lon]];
  L.circleMarker([ziel.lat, ziel.lon], { radius: 9, color: '#fff', weight: 3,
    fillColor: '#b23a2b', fillOpacity: 1 }).addTo(ebene).bindTooltip('Dein Ziel');

  liste.forEach(function (p, nr) {
    punkte.push([p.lat, p.lon]);
    const m = L.circleMarker([p.lat, p.lon], { radius: 8, color: '#fff', weight: 2,
      fillColor: punktVonKosten(p), fillOpacity: 1 }).addTo(ebene);
    m.bindTooltip((p.name ? p.name : p.art) + ' · ' + p.meter + ' m');
    // Antippen zeigt den Eintrag unten - eine Detailflaeche, nicht zwei.
    m.on('click', function () { auswaehlen(nr, true); });
    marker.push(m);
  });

  landkarte.fitBounds(L.latLngBounds(punkte).pad(0.15));
  setTimeout(function () { landkarte.invalidateSize(); }, 60);
}

// Verbindet Karte und Liste: eine Bucht ist gewaehlt, ihre Markierung waechst mit.
function auswaehlen(nr, hinscrollen) {
  if (gewaehlt >= 0) {
    const alt = $('bucht' + gewaehlt);
    if (alt) alt.classList.remove('gewaehlt');
    if (marker[gewaehlt]) marker[gewaehlt].setStyle({ radius: 8, weight: 2 });
  }
  if (gewaehlt === nr) { gewaehlt = -1; return; }    // nochmal antippen hebt die Wahl auf
  gewaehlt = nr;
  const el = $('bucht' + nr);
  if (el) el.classList.add('gewaehlt');
  if (marker[nr]) marker[nr].setStyle({ radius: 12, weight: 4 }).bringToFront();
  // Leaflet holt sich beim Antippen den Tastaturfokus; der Browser scrollt daraufhin die
  // Karte zurueck ins Bild. Darum erst danach springen, sonst verpufft der Sprung.
  if (hinscrollen && el)
    // Ausdruecklich ohne Animation: weiches Scrollen faellt in manchen Ansichten
    // wirkungslos aus, und ein Sprung, der nicht stattfindet, ist der schlimmere Fehler.
    setTimeout(function () { el.scrollIntoView({ block: 'center', behavior: 'auto' }); }, 60);
}

function zeichnen(neu) {
  const passend = filtern(treffer, an('fKostenlos'), an('fAnwohner'));
  angezeigt = passend.slice(0, MAX);
  gewaehlt = -1;

  $('schalter').classList.toggle('an', treffer.length > 0);
  $('weiter').hidden = passend.length >= 10;   // nur anbieten, wenn es wirklich duenn ist

  if (!angezeigt.length) {
    $('liste').innerHTML = '';
    $('landkarte').hidden = true;
    zeigen(treffer.length
      ? 'Alle ' + treffer.length + ' Treffer sind durch die Filter ausgeblendet.'
      : 'Nichts gefunden im Umkreis von ' + radius + ' m. Umkreis verdoppeln?', true);
    return;
  }

  zeigen([
    passend.length > MAX
      ? '<b>' + MAX + '</b> nächste von ' + passend.length + ' um <b>' + sicher(ziel.kurz) + '</b>'
      : '<b>' + passend.length + '</b> Möglichkeit' + (passend.length === 1 ? '' : 'en')
        + ' um <b>' + sicher(ziel.kurz) + '</b>',
    treffer.length - passend.length ? (treffer.length - passend.length) + ' durch Filter aus' : '',
    privatAus ? privatAus + ' privat' : '',
  ].filter(Boolean).join(' · '));

  $('liste').innerHTML = angezeigt.map(eintrag).join('');
  kartenZeichnen(angezeigt);
  auswaehlen(0, false);          // die naechste Bucht ist vorgewaehlt und sofort befahrbar
  if (neu) ansagen(fundAnsage(angezeigt[0]));
}

/* ---------- Routenführung ------------------------------------------------- */

const fuehrung = { route: null, ziel: null, schritt: 1, gesagt: {},
                   uhr: null, wache: null, linie: null, ich: null, letzteNeu: 0 };

const punktVon = s => [s.maneuver.location[1], s.maneuver.location[0]];   // OSRM: lon,lat

async function wachHalten() {
  // Ohne Wake Lock geht der Bildschirm waehrend der Fahrt aus. Nicht ueberall vorhanden.
  try {
    if ('wakeLock' in navigator) {
      fuehrung.wache = await navigator.wakeLock.request('screen');
      fuehrung.wache.addEventListener('release', function () { fuehrung.wache = null; });
    }
  } catch (e) { /* nicht kritisch, Navigation laeuft weiter */ }
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && fuehrung.route && !fuehrung.wache) wachHalten();
});

function routeMalen() {
  if (!kartenAufbauen()) return;
  if (fuehrung.linie) fuehrung.linie.remove();
  fuehrung.linie = L.polyline(fuehrung.route.linie,
    { color: '#0f4531', weight: 6, opacity: .85 }).addTo(landkarte);
  landkarte.fitBounds(fuehrung.linie.getBounds().pad(0.12));
}

function ichMalen(pos) {
  if (!kartenAufbauen()) return;
  if (!fuehrung.ich) {
    fuehrung.ich = L.circleMarker(pos, { radius: 9, color: '#fff', weight: 3,
      fillColor: '#1a73e8', fillOpacity: 1 }).addTo(landkarte);
  } else {
    fuehrung.ich.setLatLng(pos);
  }
  landkarte.panTo(pos, { animate: true });
}

async function naviStarten(p) {
  if (!p) return;
  stimmeFreischalten();
  if (!navigator.geolocation) return zeigen('Ohne Standort keine Navigation.', true);
  zeigen('Route wird berechnet …');
  navigator.geolocation.getCurrentPosition(async function (pos) {
    try {
      fuehrung.ziel = p;
      fuehrung.route = await routeHolen([pos.coords.latitude, pos.coords.longitude], [p.lat, p.lon]);
      fuehrung.schritt = Math.min(1, fuehrung.route.schritte.length - 1);
      fuehrung.gesagt = {};
      fuehrung.letzteNeu = 0;
      $('fuehrung').hidden = false;
      document.body.classList.add('navi');
      routeMalen();
      ichMalen([pos.coords.latitude, pos.coords.longitude]);
      wachHalten();
      zeigen('Navigation läuft zu <b>' + sicher(p.name || p.art) + '</b>.');
      // Anzeige sofort aus der Startposition fuellen, nicht auf die erste Ortungsmeldung
      // warten - sonst steht sekundenlang "wird berechnet", obwohl die Route fertig ist.
      naviPosition(pos, true);
      ansagen(anweisung(fuehrung.route.schritte[0], true) + '. '
        + fahrstrecke(fuehrung.route.meter) + ', etwa ' + fahrzeit(fuehrung.route.sekunden) + '.');
      fuehrung.uhr = navigator.geolocation.watchPosition(naviPosition, function () {},
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    } catch (e) {
      naviBeenden();
      zeigen(sicher(e.message), true);
    }
  }, function () { zeigen('Standort nicht verfügbar — die Navigation braucht ihn.', true); },
     { enableHighAccuracy: true, timeout: 10000 });
}

async function neuBerechnen(ich) {
  try {
    fuehrung.route = await routeHolen(ich, [fuehrung.ziel.lat, fuehrung.ziel.lon]);
    fuehrung.schritt = Math.min(1, fuehrung.route.schritte.length - 1);
    fuehrung.gesagt = {};
    routeMalen();
    ansagen('Route wird neu berechnet.');
  } catch (e) {
    $('fAnweisung').textContent = 'Neuberechnung fehlgeschlagen';
  }
}

// stumm = nur anzeigen, nicht ansagen (beim Start, damit die Streckenansage nicht zerhackt wird)
function naviPosition(pos, stumm) {
  const r = fuehrung.route;
  if (!r || !r.schritte.length) return;
  const ich = [pos.coords.latitude, pos.coords.longitude];
  ichMalen(ich);

  // Abweichung -> neu berechnen, mit Sperrzeit, sonst rechnet es sich im Kreis
  const jetzt = Date.now();
  if (abstandZurRoute(ich, r.linie) > 60 && jetzt - fuehrung.letzteNeu > 15000) {
    fuehrung.letzteNeu = jetzt;
    $('fAnweisung').textContent = 'Route wird neu berechnet …';
    neuBerechnen(ich);
    return;
  }

  // ponytail: naechstes Manoever ueber Luftlinie statt Fangen auf die Route.
  // Reicht im Stadtverkehr; bei parallel verlaufenden Strassen kann es einen Schritt zu frueh springen.
  let i = fuehrung.schritt;
  while (i < r.schritte.length - 1 && luftlinie(ich, punktVon(r.schritte[i])) < 25) i++;
  fuehrung.schritt = i;

  const naechster = r.schritte[i];
  const d = Math.round(luftlinie(ich, punktVon(naechster)));

  $('fAnweisung').textContent = anweisung(naechster);
  $('fEntfernung').textContent = fahrstrecke(d);

  let rest = d;
  for (let j = i; j < r.schritte.length; j++) rest += r.schritte[j].distance || 0;
  rest = Math.round(rest);
  const sek = r.meter ? Math.round(r.sekunden * (rest / r.meter)) : 0;
  $('fRest').textContent = 'noch ' + fahrstrecke(rest) + ' · ' + fahrzeit(sek);

  const flag = fuehrung.gesagt[i] || {};
  if (d < 300 && !flag.fern) { flag.fern = true; if (!stumm) ansagen(ansageText(naechster, d)); }
  if (d < 45 && !flag.nah) { flag.nah = true; if (!stumm) ansagen(ansageText(naechster, d)); }
  fuehrung.gesagt[i] = flag;

  if (i === r.schritte.length - 1 && d < 30) {
    ansagen('Ziel erreicht. Viel Glück beim Einparken.');
    const name = fuehrung.ziel.name || fuehrung.ziel.art;
    naviBeenden();
    zeigen('Angekommen bei <b>' + sicher(name) + '</b>.');
  }
}

function naviBeenden() {
  if (fuehrung.uhr != null) { navigator.geolocation.clearWatch(fuehrung.uhr); fuehrung.uhr = null; }
  if (fuehrung.wache) { try { fuehrung.wache.release(); } catch (e) {} fuehrung.wache = null; }
  if (fuehrung.linie) { fuehrung.linie.remove(); fuehrung.linie = null; }
  if (fuehrung.ich) { fuehrung.ich.remove(); fuehrung.ich = null; }
  fuehrung.route = null;
  $('fuehrung').hidden = true;
  document.body.classList.remove('navi');
  if (window.speechSynthesis) speechSynthesis.cancel();
}

$('fEnde').onclick = function () { naviBeenden(); zeigen('Navigation beendet.'); };

/* ---------- Bedienung ----------------------------------------------------- */

$('liste').addEventListener('click', function (e) {
  const los = e.target.closest('[data-los]');
  if (los) { naviStarten(angezeigt[+los.dataset.los]); return; }
  const b = e.target.closest('.bucht');
  if (b) auswaehlen(+b.dataset.nr, false);
});
$('liste').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest('.bucht');
  if (b) { e.preventDefault(); auswaehlen(+b.dataset.nr, false); }
});

$('formular').onsubmit = async function (e) {
  e.preventDefault();
  const text = $('eingabe').value.trim();
  if (!text) return;
  stimmeFreischalten();
  $('eingabe').blur();
  suchNr++;                 // eine noch laufende Standortabfrage wird damit entwertet
  radius = 1000;
  $('liste').innerHTML = '';
  $('landkarte').hidden = true;
  $('schalter').classList.remove('an');
  $('weiter').hidden = true;
  zeigen('Suche Adresse …');
  try {
    const g = await geocode(text);
    ziel = { lat: g.lat, lon: g.lon, kurz: g.label.split(',').slice(0, 2).join(',') };
    await laden();
  } catch (e) {
    zeigen(sicher(e.message), true);
  }
};

function standortSuchen() {
  if (!navigator.geolocation) return zeigen('Dieses Gerät gibt den Standort nicht heraus.', true);
  const meine = ++suchNr;
  zeigen('Bestimme Standort …');
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      if (meine !== suchNr) return;
      radius = 1000;
      ziel = { lat: pos.coords.latitude, lon: pos.coords.longitude, kurz: 'deinem Standort' };
      laden();
    },
    function () {
      if (meine !== suchNr) return;
      zeigen('Standort nicht verfügbar — Ortungsfreigabe prüfen, oder Ziel oben eintippen.'
        + '<button class="zweit" type="button" onclick="standortSuchen()">Standort nochmal versuchen</button>', true);
    },
    { enableHighAccuracy: true, timeout: 10000 });
}
$('hier').onclick = function () { stimmeFreischalten(); standortSuchen(); };

$('weiter').onclick = function () { radius *= 2; laden(); };

['fKostenlos', 'fAnwohner', 'fAnsage'].forEach(function (id) {
  $(id).onclick = function (e) {
    const b = e.currentTarget;
    b.setAttribute('aria-pressed', an(id) ? 'false' : 'true');
    if (id === 'fAnsage') { if (!an(id) && window.speechSynthesis) speechSynthesis.cancel(); return; }
    zeichnen(false);
  };
});

// Beim Start sofort von hier aus suchen — das ist der eigentliche Fall: man steht schon da
// und sucht. Wer vorausplant, tippt oben ein Ziel ein.
standortSuchen();
</script>
</body>
</html>
