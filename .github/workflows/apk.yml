name: APK bauen

# Der GitHub-Runner bringt Java und das Android-SDK schon mit. Damit muss lokal
# nichts installiert werden - das fertige APK haengt danach unter "Releases".
#
# Signiert wird mit einem festen Schluessel aus den Repo-Geheimnissen, nicht mit
# dem wechselnden Debug-Schluessel. Nur so laesst sich eine neue Fassung ueber
# eine bereits installierte legen, ohne vorher zu deinstallieren.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Web-Dateien einsammeln
        run: |
          mkdir -p www
          cp index.html park.js navi.js manifest.json preise.json favicon.png icon-*.png www/
          ls -1 www/

      - name: Android-Projekt erzeugen
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/speech-recognition
          npx cap init Parkfuchs de.parkfuchs.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Berechtigungen anmelden
        run: python3 bau/berechtigungen.py

      - name: Versionsnummer hochzaehlen
        run: |
          # Ohne steigende versionCode verweigert Android das Update ueber eine
          # bereits installierte Fassung.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Startsymbole setzen
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          ls -l android/app/build/outputs/apk/release/

      - name: Signieren
        env:
          SCHLUESSEL: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          test -n "$SCHLUESSEL" || { echo "Geheimnis ANDROID_KEYSTORE_B64 ist leer"; exit 1; }
          WERKZEUG=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$SCHLUESSEL" | base64 -d > schluessel.p12
          UNSIGNIERT=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          "$WERKZEUG/zipalign" -p -f 4 "$UNSIGNIERT" ausgerichtet.apk
          "$WERKZEUG/apksigner" sign --ks schluessel.p12 --ks-type PKCS12 --ks-key-alias parkfuchs --ks-pass env:KSPW --key-pass env:KSPW --out parkfuchs.apk ausgerichtet.apk
          rm -f schluessel.p12 ausgerichtet.apk

      # Das fertige Paket selbst pruefen, statt darauf zu vertrauen, dass der Bau
      # schon stimmt. Schlaegt eine dieser Pruefungen fehl, gibt es keine Freigabe.
      - name: APK pruefen
        run: |
          WERKZEUG=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "--- Eckdaten"
          "$WERKZEUG/aapt2" dump badging parkfuchs.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)"
          echo "--- Signatur"
          "$WERKZEUG/apksigner" verify --verbose --print-certs parkfuchs.apk | grep -E "Verifies|scheme|Signer #1 certificate (DN|SHA-256)"
          echo "--- Berechtigungen"
          "$WERKZEUG/aapt2" dump badging parkfuchs.apk | grep "uses-permission" || true
          for RECHT in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION RECORD_AUDIO; do
            "$WERKZEUG/aapt2" dump badging parkfuchs.apk | grep -q "android.permission.$RECHT" || { echo "FEHLER: Berechtigung $RECHT fehlt - Standort bzw. Diktat wuerden stumm scheitern"; exit 1; }
          done
          echo "--- Nicht auf Fehlersuche gebaut"
          if "$WERKZEUG/aapt2" dump badging parkfuchs.apk | grep -q "application-debuggable"; then
            echo "FEHLER: Paket ist als debuggable gebaut"; exit 1
          fi
          echo "ok, kein Debug-Paket"
          echo "--- Groesse und Pruefsumme"
          stat -c%s parkfuchs.apk
          sha256sum parkfuchs.apk | tee pruefsumme.txt

      - name: Zum Herunterladen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMME=$(cut -d' ' -f1 pruefsumme.txt)
          GROESSE=$(stat -c%s parkfuchs.apk)
          TEXT="Fassung 1.0.${{ github.run_number }} - automatisch gebaut und geprueft.

          Groesse: $GROESSE Bytes
          SHA-256: $SUMME

          Fest signiert: neue Fassungen lassen sich ueber eine bereits installierte legen,
          ohne vorher zu deinstallieren. Auf dem Handy muss die Installation aus
          unbekannten Quellen erlaubt sein; bei neueren Samsung-Geraeten zusaetzlich die
          'Automatische Blockierung' unter Sicherheit ausschalten.

          Bei 'Problem beim Parsen des Pakets' ist fast immer der Download unvollstaendig -
          Dateigroesse mit der Angabe oben vergleichen und ueber WLAN erneut laden."
          gh release create apk --title "Parkfuchs - aktueller Stand" --notes "$TEXT" || gh release edit apk --title "Parkfuchs - aktueller Stand" --notes "$TEXT"
          gh release upload apk parkfuchs.apk --clobber

      - name: APK auch als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: parkfuchs-apk
          path: parkfuchs.apk
          if-no-files-found: ignore
